[package]
name = "nsh-app--android"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "nsh_app__android"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["js"]
dev = ["nsh-platform-android/dev"]
js = ["nsh-platform-android/js"]
shader = ["nsh-platform-android/shader"]
editor = ["nsh-platform-android/editor"]
emoji-picker = ["nsh-platform-android/emoji-picker"]
highlight = ["nsh-platform-android/highlight"]
math = ["nsh-platform-android/math"]
plot = ["nsh-platform-android/plot"]
rich-editor = ["nsh-platform-android/rich-editor"]
term = ["nsh-platform-android/term"]
zlib = ["nsh-platform-android/zlib"]
crypto = ["nsh-platform-android/crypto"]

[dependencies]
nsh-core = { version = "=0.5.0" }
nsh-platform-android = { version = "=0.5.0", default-features = false }
nsh-base = { version = "=0.5.0", default-features = false }

