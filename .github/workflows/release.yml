name: release

# 推 tag（v1.2.3）就出包并挂到 Release 上。
# 版本号从 tag 来：v1.2.3 → versionName 1.2.3、versionCode 由 run number 递增。
# workflow_dispatch 只构建、不建 Release，用来验证流水线。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.2'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        run: |
          V="${APP_VERSION#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "版本: $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 必须用正式版。nightly 的 classes.dex 用新协议，而 crates.io 上的
      # crate 还是旧的，编出来的 .so 与之不匹配，一启动就
      # ArrayIndexOutOfBounds（Mounter.string）。正式版没这个问题。
      - name: 装 NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.nsh/bin/nsh" --version

      # 裁剪版运行时是 cargo 交叉编译出来的：要 Rust 的 android target 和 NDK
      - name: 装编译工具链
        run: |
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          echo "build-tools: $(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"

      # 测试跑不过不该挡住发版：headless 依赖很少，但 CI 环境差异万一出问题，
      # 出包还是要继续。失败会标黄，看得到。
      - name: 测试
        continue-on-error: true
        working-directory: nsh
        run: nsh test

      - name: 还原发布签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p nsh/.signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > nsh/.signing/release.keystore

      # 13 MB：只打 arm64-v8a、.so deflate、再现场编译一个只含 JS 引擎的运行时。
      # 骨架在 nsh/runtime/，所以干净 checkout 也能裁。编译失败自动退回 21 MB。
      - name: 打包
        working-directory: nsh
        env:
          NSH_KEYSTORE: ${{ github.workspace }}/nsh/.signing/release.keystore
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./package-android.sh --trim "dist/kansha-${APP_VERSION}-arm64.apk"
          # apksigner 顺手生成 .idsig（v4 签名），Release 里不需要
          rm -f dist/*.idsig
          ls -lh dist/

      - name: 校验签名与体积
        working-directory: nsh
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/kansha-${APP_VERSION}-arm64.apk" | head -4
          "$BT/aapt2" dump badging "dist/kansha-${APP_VERSION}-arm64.apk" | grep -E "^(package|application-label)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nsh/dist/*.apk

  # iOS 只能在 macOS 上打：图标要 Xcode 的 actool，签名要 codesign。
  # 没有 Apple 证书时出未签名 ipa —— 用 Sideloadly / AltStore 自签安装，
  # 免费 Apple ID 签的证书 7 天失效，到期重签。有证书就走正式签名。
  ios:
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        run: |
          V="${APP_VERSION#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "版本: $V"

      - name: 装 NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.nsh/bin/nsh" --version
          nsh component add ios

      - name: 确认 Xcode
        run: |
          xcodebuild -version
          xcrun --find actool

      - name: 测试
        continue-on-error: true
        working-directory: nsh
        run: nsh test

      # 有证书就装进临时 keychain，nsh package 才找得到签名身份。
      # 三个 secret 缺任何一个都走未签名。
      - name: 准备签名材料
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "没有 Apple 证书，出未签名 ipa"
            exit 0
          fi
          KC_PASS=$(uuidgen)
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep -m1 -oE '"(Apple (Development|Distribution) [^"]*)"' | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "证书导入了但找不到可用身份"; exit 1
          fi
          echo "身份: $IDENTITY"
          echo "NSH_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NSH_PROFILE=$RUNNER_TEMP/app.mobileprovision" >> "$GITHUB_ENV"

      - name: 打包 ipa
        working-directory: nsh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x package-ios.sh
          ./package-ios.sh "dist/kansha-${APP_VERSION}.ipa"
          ls -lh dist/

      # iPhone 和 iPad 必须都在（UIDeviceFamily 1 和 2）
      - name: 校验
        working-directory: nsh
        run: |
          IPA="dist/kansha-${APP_VERSION}.ipa"
          unzip -l "$IPA" | head -12
          unzip -p "$IPA" 'Payload/*/Info.plist' > /tmp/p.plist
          python3 - /tmp/p.plist <<'PY'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], 'rb'))
          bid = d['CFBundleIdentifier']
          fam = [int(x) for x in d.get('UIDeviceFamily', [])]
          assert bid == 'top.zvector.kansha', bid
          assert 1 in fam and 2 in fam, f'UIDeviceFamily={fam}，需要同时含 iPhone(1) 和 iPad(2)'
          print('bundle:', bid, d['CFBundleShortVersionString'], 'build', d['CFBundleVersion'])
          print('名字:', d.get('CFBundleDisplayName'))
          print('UIDeviceFamily:', fam, '→ iPhone + iPad')
          print('最低系统:', d.get('MinimumOSVersion'))
          PY

      # 真跑一遍：同一份 .app 装进 iPhone 和 iPad 模拟器各截一张图。
      # 这是唯一能验证 iPad 布局（idiom=pad 分支）的办法。
      - name: 模拟器实测
        continue-on-error: true
        working-directory: nsh
        run: |
          nsh package App.tsx --target ios-simulator -o "$RUNNER_TEMP/sim"
          APP=$(ls -d "$RUNNER_TEMP"/sim/*.app | head -1)
          echo "APP=$APP"
          mkdir -p shots
          shoot() {
            udid=$(xcrun simctl list devices available \
              | grep -E "$1" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
            if [ -z "$udid" ]; then echo "没有匹配 $1 的模拟器"; return 1; fi
            echo "→ $1 ($udid)"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" top.zvector.kansha
            sleep 8
            xcrun simctl io "$udid" screenshot "shots/$2.png"
          }
          shoot "iPhone 1[0-9]" iphone
          shoot "iPad Air|iPad Pro" ipad
          ls -lh shots/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: nsh/dist/*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: nsh/shots/*.png

  # 一个 job 统一建 Release：两个平台的包挂在同一个 tag 下，
  # 免得两个 job 并发写同一个release互相覆盖。
  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      # iOS 挂了也要发 Android，所以下载失败不算错
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: dist

      - name: 拼说明
        run: |
          V="${APP_VERSION#v}"
          ls -lh dist/ || true
          # Android 是主力，没有它就别发了
          ls dist/*.apk >/dev/null 2>&1 || { echo "没有 APK，中止"; exit 1; }
          {
            echo "## 看啥 $V"
            echo
            echo "随机推荐一部 B 站能看的电影。打开就是一部，不喜欢就「换一个」。"
            echo
            echo "### 下载"
            echo
            echo "| 平台 | 文件 | 说明 |"
            echo "|---|---|---|"
            echo "| Android | \`kansha-$V-arm64.apk\` | Android 8+，arm64 设备 |"
            if ls dist/*.ipa >/dev/null 2>&1; then
              echo "| iOS | \`kansha-$V.ipa\` | iOS 15+，iPhone 和 iPad |"
            fi
            echo
            echo "### 怎么装"
            echo
            echo "**Android** — 允许「安装未知来源的应用」后直接装。APK 用的是自签名证书（不是 Google Play 上架包），以后升级直接覆盖；装过 debug 版的话要先卸载，签名不同装不上。"
            echo
            if ls dist/*.ipa >/dev/null 2>&1; then
              echo "**iOS** — 包是**未签名**的，App Store 装不了，要用 [Sideloadly](https://sideloadly.io) 或 AltStore 拿自己的 Apple ID 签一次：把 ipa 拖进工具、填 Apple ID、装到手机。"
              echo "免费 Apple ID 签的证书 7 天失效，到期重签一次就行，「已看」记录不会丢（存在 app 自己的存储里）。"
              echo "想长期用就买开发者账号（99 美元/年），证书一年有效。"
            fi
          } > body.md
          cat body.md

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 看啥 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          body_path: body.md
