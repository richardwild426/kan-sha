name: release

# 推 tag（v1.2.3）就出包并挂到 Release 上。
# 版本号从 tag 来：v1.2.3 → versionName 1.2.3、versionCode 由 run number 递增。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.nsh/bin/nsh" --version

      # runner 自带 Android SDK / build-tools / NDK，装 NSH 之后直接能打。
      # 这里只确认一下关键工具在，缺了早失败好过打一半。
      - name: 检查 Android 工具
        run: |
          echo "SDK: ${ANDROID_HOME:-未设置}"
          echo "build-tools: $(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-未预装（只有 --trim 才需要）}"

      # 测试跑不过不该挡住发版：headless 依赖很少，但 CI 环境差异万一出问题，
      # 出包还是要继续。失败会标黄，看得到。
      - name: 测试
        continue-on-error: true
        working-directory: nsh
        run: nsh test

      - name: 还原发布签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p nsh/.signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > nsh/.signing/release.keystore

      # CI 里是 21 MB（预编译运行时）。13 MB 的裁剪版要靠 NSH > 0.5.1 现场
      # 编译运行时，0.5.1 不会生成 .nsh/rust，所以拿不到 13 MB 的包。
      # NSH 发了带裁剪逻辑的版本后，把 install.sh 换成定点版本即可自动变小。
      - name: 打包
        working-directory: nsh
        env:
          NSH_KEYSTORE: ${{ github.workspace }}/nsh/.signing/release.keystore
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./package-android.sh --trim "dist/看啥-${APP_VERSION}-arm64.apk"
          ls -lh dist/

      - name: 校验签名与体积
        working-directory: nsh
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/看啥-${APP_VERSION}-arm64.apk" | head -4
          "$BT/aapt2" dump badging "dist/看啥-${APP_VERSION}-arm64.apk" | grep -E "^(package|application-label)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nsh/dist/*.apk

      - name: 建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 看啥 ${{ steps.v.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: nsh/dist/*.apk
          body: |
            ## 看啥 ${{ steps.v.outputs.version }}

            随机推荐一部 B 站能看的电影。打开就是一部，不喜欢就「换一个」。

            ### 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Android | `看啥-${{ steps.v.outputs.version }}-arm64.apk` | Android 8+，arm64 设备 |

            装之前先允许「安装未知来源的应用」。

            > APK 用的是自签名证书（不是 Google Play 上架包）。以后升级直接覆盖安装；
            > 如果之前装过 debug 版，需要先卸载，因为签名不同。
