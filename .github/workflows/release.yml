name: release

# 推 tag（v1.2.3）就出包并挂到 Release 上。
# 版本号从 tag 来：v1.2.3 → versionName 1.2.3、versionCode 由 run number 递增。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: v
        run: |
          V="${APP_VERSION#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "版本: $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 需要带裁剪逻辑的 nsh（main / nightly）：它 package 时会写下
      # .nsh/rust 骨架，脚本据此现场编译只含 JS 引擎的运行时。
      # 0.5.1 不生成那个目录，出的是 22 MB 的预编译版。
      - name: 装 NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.nsh/bin/nsh" --version

      # 裁剪版运行时是 cargo 交叉编译出来的，要 Rust 的 android target 和 NDK
      - name: 装编译工具链
        run: |
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          echo "build-tools: $(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"

      # 测试跑不过不该挡住发版：headless 依赖很少，但 CI 环境差异万一出问题，
      # 出包还是要继续。失败会标黄，看得到。
      - name: 测试
        continue-on-error: true
        working-directory: nsh
        run: nsh test

      - name: 还原发布签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p nsh/.signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > nsh/.signing/release.keystore

      # 13 MB：现场交叉编译一个只含 JS 引擎的运行时（首次约 2 分钟）。
      # 编译失败会自动退回 22 MB 的预编译版，不会挡住发版。
      - name: 打包
        working-directory: nsh
        env:
          NSH_KEYSTORE: ${{ github.workspace }}/nsh/.signing/release.keystore
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./package-android.sh --trim "dist/kansha-${APP_VERSION}-arm64.apk"
          # apksigner 顺手生成 .idsig（v4 签名），Release 里不需要
          rm -f dist/*.idsig
          ls -lh dist/

      - name: 校验签名与体积
        working-directory: nsh
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/kansha-${APP_VERSION}-arm64.apk" | head -4
          "$BT/aapt2" dump badging "dist/kansha-${APP_VERSION}-arm64.apk" | grep -E "^(package|application-label)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nsh/dist/*.apk

      - name: 建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 看啥 ${{ steps.v.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: nsh/dist/*.apk
          body: |
            ## 看啥 ${{ steps.v.outputs.version }}

            随机推荐一部 B 站能看的电影。打开就是一部，不喜欢就「换一个」。

            ### 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Android | `kansha-${{ steps.v.outputs.version }}-arm64.apk` | Android 8+，arm64 设备 |

            装之前先允许「安装未知来源的应用」。

            > APK 用的是自签名证书（不是 Google Play 上架包）。以后升级直接覆盖安装；
            > 如果之前装过 debug 版，需要先卸载，因为签名不同。
